
name: KisanDrishti ONNX Converter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-model:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install conversion tools
        run: |
          python -m pip install --upgrade pip
          pip install "optimum[onnxruntime]==1.27.0" "transformers==4.53.3" safetensors

      - name: Convert Hugging Face model to ONNX
        run: |
          optimum-cli export onnx \
            --model LishaV01/agriculture-crop-disease-detection \
            --task image-classification \
            --opset 17 \
            onnx-model

      - name: Verify ONNX model
        run: |
          python - <<'PY'
          import onnxruntime as ort
          import os

          path = "onnx-model/model.onnx"
          assert os.path.exists(path), "ONNX model not found"

          session = ort.InferenceSession(
              path,
              providers=["CPUExecutionProvider"]
          )

          print("ONNX model loaded successfully!")
          print("Inputs:", [(x.name, x.shape) for x in session.get_inputs()])
          print("Outputs:", [(x.name, x.shape) for x in session.get_outputs()])
          print("Model size:", os.path.getsize(path) / 1024 / 1024, "MB")
          PY

      - name: Upload converted model
        uses: actions/upload-artifact@v4
        with:
          name: kisandrishti-onnx-model
          path: onnx-model/
          retention-days: 7
